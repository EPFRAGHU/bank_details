<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .form-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group { flex: 1; }

    button {
      width: 100%;
      padding: 13px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover { background: #5568d3; }

    .status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    .status.ok { color: #1f8a4c; }
    .status.err { color: #c0392b; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Create your account</h1>
    <p class="subtitle">Enter your details to get started.</p>
    <form id="onboardForm">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="full_name" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="row">
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 555 000 0000" />
        </div>
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="date_of_birth" />
        </div>
      </div>
      <div class="form-group">
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Select a country</option>
          <option>United States</option>
          <option>United Kingdom</option>
          <option>India</option>
          <option>Germany</option>
          <option>Japan</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required />
      </div>
      <button type="submit">Create Account</button>
      <p id="status" class="status"></p>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:13px; color:#666;">
      Already have an account? <a href="/login" style="color:#667eea; text-decoration:none; font-weight:600;">Sign in</a>
    </p>

    <script>
      const form = document.getElementById('onboardForm');
      const status = document.getElementById('status');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.textContent = 'Submitting...';
        status.className = 'status';
        const data = Object.fromEntries(new FormData(form).entries());
        try {
          const res = await fetch('/api/onboard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          const body = await res.json();
        if (res.ok) {
          status.textContent = body.message + ' Redirecting to login...';
          status.className = 'status ok';
          form.reset();
          setTimeout(() => { window.location.href = '/login'; }, 1000);
          } else {
            status.textContent = body.message || 'Submission failed';
            status.className = 'status err';
          }
        } catch (err) {
          status.textContent = 'Network error';
          status.className = 'status err';
        }
      });
    </script>
  </div>
</body>
</html>
